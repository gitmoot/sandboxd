name: conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-suites:
    name: E2B SDK and Gitmoot conformance (devvm driver)
    # The devvm driver runs local processes, not guest images, so the runner
    # architecture only has to match where expected.json was recorded (x86_64).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Harness unit tests
        run: python3 -m unittest discover -s conformance -v
      - name: Dev driver vet and tests
        run: |
          go vet -tags sandboxd_devdriver ./...
          go test -race -tags sandboxd_devdriver -count=1 ./internal/vm/devvm/
      - name: Committed matrix matches the recorded outcomes
        run: |
          python3 conformance/run.py --render
          git diff --exit-code -- docs/conformance-matrix.md
      # e2b guests run the pinned upstream envd as root through the runner's
      # passwordless sudo (see internal/vm/devvm/envd.go).
      - name: Run pinned suites and compare with conformance/expected.json
        run: |
          sudo -n true
          python3 conformance/run.py --report "$RUNNER_TEMP/conformance"
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance
          if-no-files-found: warn
